name: Native Windows and Ubuntu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build frontend on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./build.ps1 -Clean
      - name: Build frontend on Ubuntu
        if: runner.os == 'Linux'
        run: bash ./build.sh --clean
      - name: Test native backend and launcher
        run: python -m unittest discover -s tests -v
      - name: Test annotation safety
        run: npm run test --prefix frontend
      - name: Smoke test Windows setup batch file
        if: runner.os == 'Windows'
        shell: cmd
        env:
          LABELIMG_NO_PAUSE: '1'
        run: setup.bat -SkipSam
