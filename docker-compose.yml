services:
  labelimg-next:
    build:
      context: .
    image: labelimg-next:local
    ports:
      - "${LABELIMG_PORT:-8000}:8000"
    environment:
      LABELIMG_DISABLE_FILE_DIALOGS: "1"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./models
        target: /app/models
      - type: bind
        source: ${LABELIMG_DATASETS_DIR:-./datasets}
        target: /datasets
    restart: unless-stopped
